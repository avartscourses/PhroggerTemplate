
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phrogger | Unity Web Player</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    /* Responsive desktop layout */
    body {
      margin: 0;
    }

    #unity-container.unity-desktop {
      position: relative;
      top: auto;
      left: auto;
      transform: none;

      width: min(
        960px,
        calc(100vw - 24px),
        calc((100vh - 70px) * 1.6)
      );

      height: auto;
      margin: 12px auto;
    }

    #unity-container.unity-desktop #unity-canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 8 / 5;
    }

    #unity-container.unity-desktop #unity-footer {
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">

    <canvas id="unity-canvas"
            width="960"
            height="600"
            tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Phrogger</div>
    </div>

  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/PhrrogerWebBuild.loader.js";

    var config = {
      arguments: [],

      dataUrl:
        buildUrl + "/PhrrogerWebBuild.data",

      frameworkUrl:
        buildUrl + "/PhrrogerWebBuild.framework.js",

      codeUrl:
        buildUrl + "/PhrrogerWebBuild.wasm",

      streamingAssetsUrl: "StreamingAssets",

      companyName: "DefaultCompany",
      productName: "prj2",
      productVersion: "0.1.0",

      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document.head.appendChild(meta);

      document.querySelector("#unity-container").className =
        "unity-mobile";

      canvas.className = "unity-mobile";

    } else {

      // Responsive canvas on desktop browsers
      canvas.style.width = "100%";
      canvas.style.height = "auto";

    }

    document.querySelector("#unity-loading-bar").style.display =
      "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {

      createUnityInstance(canvas, config, (progress) => {

        document.querySelector(
          "#unity-progress-bar-full"
        ).style.width = 100 * progress + "%";

      }).then((unityInstance) => {

        document.querySelector(
          "#unity-loading-bar"
        ).style.display = "none";

        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {
          unityInstance.SetFullscreen(1);
        };

      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
